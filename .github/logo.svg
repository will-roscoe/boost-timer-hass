<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="boost-timer-hass">
  <defs>
    <linearGradient id="fill" x1="0.15" y1="0.9" x2="0.85" y2="0.1">
      <stop offset="0" stop-color="rgb(255, 196, 92)"/>
      <stop offset="0.5" stop-color="rgb(255, 128, 48)"/>
      <stop offset="1" stop-color="rgb(226, 62, 52)"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.6" y2="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#fill)"/>
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#sheen)"/>
  <!-- radiator: four fins on two rails -->
  <g fill="#fff">
    <rect x="20" y="30" width="9" height="46" rx="4.5"/>
    <rect x="33" y="30" width="9" height="46" rx="4.5"/>
    <rect x="46" y="30" width="9" height="46" rx="4.5"/>
    <rect x="59" y="30" width="9" height="46" rx="4.5"/>
    <rect x="16" y="38" width="56" height="5" rx="2.5"/>
    <rect x="16" y="64" width="56" height="5" rx="2.5"/>
  </g>
  <!-- boost timer: four LEDs, three lit -->
  <g>
    <circle cx="80" cy="34" r="4.2" fill="#fff"/>
    <circle cx="80" cy="46" r="4.2" fill="#fff"/>
    <circle cx="80" cy="58" r="4.2" fill="#fff"/>
    <circle cx="80" cy="70" r="4.2" fill="#fff" fill-opacity="0.35"/>
  </g>
  <!-- heat -->
  <g fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round">
    <path d="M28 22 q-3 -4 0 -8"/>
    <path d="M44 22 q-3 -4 0 -8"/>
    <path d="M60 22 q-3 -4 0 -8"/>
  </g>
</svg>
